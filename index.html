<script>
if (window.innerWidth >= 1024) {
  const scripts = [
    'p5.min.js',
    'p5.sound.min.js',
    'sketch.js',
    'sounds.js',
    'spawn.js',
    'start.js',
    'draw/character.js',
    'draw/spaceship.js',
    'draw/asteroid.js',
    'draw/window.js',
    'draw/plaque.js',
    'draw/sky.js',
    'draw/plant.js',
    'draw/collectable.js',
    'draw/blackhole.js',
    'draw/flagpole.js',
    'draw/platform.js',
    'draw/enemy.js',
    'movements.js',
    'death.js'
  ];

  scripts.forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    document.body.appendChild(s);
  });
}
</script>
